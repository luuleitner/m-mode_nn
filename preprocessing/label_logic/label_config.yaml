# ==================================================
# LABEL EXTRACTION CONFIGURATION
# ==================================================
# Single source of truth for all labeling parameters.
# Used by: processor.py, training scripts, visualization, evaluation

# --------------------------------------------------
# CLASS DEFINITIONS (single source of truth)
# --------------------------------------------------
classes:
  # Noise class toggle:
  #   true  = 5 classes (Noise, Up, Down, Left, Right) - labels 0-4
  #   false = 4 classes (Up, Down, Left, Right) - noise filtered, labels remapped to 0-3
  include_noise: true

  noise_class: 0              # Index of noise/neutral class (when included)

  # Note: num_classes is derived at runtime:
  #   5 if include_noise else 4

  # Class name mapping (used in visualizations, metrics, reports)
  # Full 5-class names always defined here. When include_noise=false,
  # training scripts use names[1:] and remap labels automatically.
  names:
    0: "Noise"
    1: "Up"
    2: "Down"
    3: "Left"
    4: "Right"

  # Short names for compact displays
  short_names:
    0: "N"
    1: "U"
    2: "D"
    3: "L"
    4: "R"

  # Colors for visualization (rgba format)
  colors:
    0: "rgba(128, 128, 128, 0.3)"   # Noise - Gray
    1: "rgba(0, 200, 0, 0.4)"       # Up - Green
    2: "rgba(200, 0, 0, 0.4)"       # Down - Red
    3: "rgba(0, 100, 255, 0.4)"     # Left - Blue
    4: "rgba(255, 165, 0, 0.4)"     # Right - Orange

# --------------------------------------------------
# LABELING METHOD & PARAMETERS
# --------------------------------------------------
method: "segment_classify"     # segment_classify (two-pass: detect → label)
axis: "dual"                   # x | y | dual

# Axis modes:
#   x:    3-class using X-axis only (0=noise, 1=positive, 2=negative)
#   y:    3-class using Y-axis only (0=noise, 1=positive, 2=negative)
#   dual: 5-class using both axes with amplitude voting:
#         0=noise, 1=up, 2=down, 3=left, 4=right

# --------------------------------------------------
# SEGMENT-CLASSIFY PARAMETERS
# --------------------------------------------------
# Two-pass approach:
#   Pass 1 (detect_movements): position-based activity detection
#     - Smooth |position| with moving average
#     - Threshold to find regions where joystick is deflected from center
#     - Cleanup: remove short segments, merge close ones
#   Pass 2 (label_movements): peak-displacement classification
#     - For each segment, find peak |position|
#     - Direction = sign of peak position
segment_classify:
  activity_threshold_percent: 10.0  # % of max |position| to count as "active"
  smooth_window: 10               # moving average window for |position| (samples)
  min_duration: 10                 # discard segments shorter than this (samples)
  merge_gap: 3                    # merge segments with gap smaller than this (samples)

# --------------------------------------------------
# SOFT LABELS (for training)
# --------------------------------------------------
soft_labels:
  enabled: true
  weighting: "gaussian"         # uniform | gaussian
  gaussian_sigma_ratio: 0.25    # sigma = window_size * ratio

# --------------------------------------------------
# JOYSTICK SIGNAL FILTERS
# --------------------------------------------------
# Applied before label extraction to reduce noise and
# improve movement detection accuracy.

filters:
  position:
    lowpass:
      enabled: true
      cutoff: 5             # Hz
      fs: 175               # sampling frequency Hz
      order: 2
      ax: 0
    savitzky_golay:
      enabled: true
      window_length: 51     # must be odd
      polyorder: 2

  derivative:
    moving_average:
      enabled: true
      window_size: 20

# --------------------------------------------------
# VISUALIZATION
# --------------------------------------------------
display:
  show_raw_trace: true
